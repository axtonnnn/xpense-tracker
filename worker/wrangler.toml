name = "xpense-ai"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# shared/schemas.ts lives outside this folder; make sure it bundles this package's zod.
[alias]
"zod" = "./node_modules/zod"

# The website: the home page (/) and the privacy policy, terms and support pages (docs/*.md, bundled
# as text and served at /privacy, /terms and /support — use those URLs in App Store Connect).
# Fonts and screenshots for it are static files in ./public.
[assets]
directory = "./public"

[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[vars]
# Shown on the /privacy, /terms and /support pages. Fill these in before you publish.
OWNER_NAME = "REPLACE with your name or company"
CONTACT_EMAIL = "REPLACE with your support email"
GOVERNING_LAW = "REPLACE with your country or state, e.g. the State of California, USA"
LAST_UPDATED = "REPLACE with the date you publish, e.g. 1 November 2026"
# Optional: once the app is live, its store links add download buttons to the home page.
APP_STORE_URL = ""
PLAY_STORE_URL = ""

# Accounts: your Supabase project URL (Project Settings → API). Sign-in tokens are checked against it.
SUPABASE_URL = "REPLACE with your Supabase project URL, e.g. https://abcd1234.supabase.co"

FREE_TRIAL_SCANS = "3"
# Pro fair-use caps per calendar month. At max effort each scan costs ≈ $0.002–0.008,
# so 300 scans is at most ≈ $2.40 for an extreme user; lower these to tighten worst-case cost.
PRO_MONTHLY_SCANS = "300"
PRO_MONTHLY_CHECKS = "300"
PRO_MONTHLY_REVIEWS = "30"

# Create with: npx wrangler kv namespace create USAGE  — then paste the id here.
[[kv_namespaces]]
binding = "USAGE"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Burst protection: at most 10 AI requests per account per minute.
[[ratelimits]]
name = "BURST_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Secrets (never commit these):
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put REVENUECAT_SECRET_KEY
#   npx wrangler secret put SUPABASE_SECRET_KEY      (Project Settings → API keys → secret key; used to delete accounts)
